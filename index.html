<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>浚鍵管理有限公司 - 行車記錄表</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <style>
        /* ===== 主題變數：全方位美化配色 ===== */
        :root {
            --bg-body: #f4f6f9;
            --bg-card: #ffffff;
            --text-main: #2c3e50;
            --text-label: #596780;
            --text-title: #1e3a8a;
            --border: #e2e8f0;
            --border-light: #edf2f7;
            --th-bg: #f8fafc;
            --th-text: #334155;
            --summary-bg: #fef3c7;
            --month-summary-bg: #f3e8ff;
            --btn-add: #2563eb;
            --btn-export: #059669;
            --btn-search: #7c3aed;
            --btn-del-bg: #fee2e2;
            --btn-del-text: #991b1b;
            --tab-bg: #e2e8f0;
            --tab-text: #64748b;
            --tab-active: #2563eb;
            --cloud-ok: #059669;
            --cloud-err: #dc2626;
            --section-title: #2563eb;
            --shadow: rgba(0, 0, 0, 0.04);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-label: #94a3b8;
            --text-title: #60a5fa;
            --border: #334155;
            --border-light: #273548;
            --th-bg: #334155;
            --th-text: #f8fafc;
            --summary-bg: #451a03;
            --month-summary-bg: #3b0764;
            --btn-add: #3b82f6;
            --btn-export: #10b981;
            --btn-search: #8b5cf6;
            --btn-del-bg: #7f1d1d;
            --btn-del-text: #fecaca;
            --tab-bg: #334155;
            --tab-text: #94a3b8;
            --tab-active: #3b82f6;
            --cloud-ok: #34d399;
            --cloud-err: #f87171;
            --section-title: #60a5fa;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 12px; background-color: var(--bg-body); color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
        .card { background: var(--bg-card); padding: 16px; border-radius: 12px; box-shadow: 0 4px 12px var(--shadow); margin-bottom: 12px; transition: background-color 0.3s, box-shadow 0.3s; border: 1px solid var(--border); }
        h2 { text-align: center; font-size: 18px; margin: 0 0 12px 0; color: var(--text-title); }
        label { display: block; font-size: 13px; font-weight: bold; margin-top: 8px; color: var(--text-label); }
        input, select, button { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: var(--bg-card); color: var(--text-main); transition: border-color 0.2s, background-color 0.3s, color 0.3s; }
        input:focus, select:focus { outline: none; border-color: var(--tab-active); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .stepper-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }
        .stepper-btn {
            width: 48px;
            height: 48px;
            font-size: 22px;
            font-weight: bold;
            background-color: var(--tab-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            user-select: none;
            transition: background 0.2s;
        }
        .stepper-btn:active {
            background-color: var(--tab-active);
            color: white;
        }
        .stepper-input {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            height: 48px;
            margin-top: 0 !important;
        }

        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }
        .btn-add { background-color: var(--btn-add); color: white; font-weight: bold; border: none; margin-top: 14px; cursor: pointer; padding: 12px; transition: opacity 0.2s; }
        .btn-add:hover { opacity: 0.9; }
        .btn-search { background-color: var(--btn-search); color: white; font-weight: bold; border: none; margin-top: 8px; cursor: pointer; padding: 12px; transition: opacity 0.2s; }
        .btn-search:hover { opacity: 0.9; }
        .btn-del { background-color: var(--btn-del-bg); color: var(--btn-del-text); border: none; padding: 6px 10px; border-radius: 4px; font-size: 11px; width: auto; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 11px; }
        th, td { border: 1px solid var(--border-light); padding: 8px 4px; text-align: center; }
        th { background-color: var(--th-bg); color: var(--th-text); }
        .summary { font-weight: bold; background-color: var(--summary-bg); font-size: 13px; color: var(--text-main); border: 1px solid rgba(245, 158, 11, 0.3); }
        .section-title { font-size: 13px; color: var(--section-title); margin-top: 12px; font-weight: bold; border-bottom: 1px solid var(--border-light); padding-bottom: 4px; }
        .nav-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
        .nav-tabs button { flex: 1; padding: 10px; background: var(--tab-bg); border: none; font-weight: bold; color: var(--tab-text); cursor: pointer; border-radius: 8px; transition: background 0.2s, color 0.2s; }
        .nav-tabs button.active { background: var(--tab-active); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .cloud-status { font-size: 11px; text-align: center; color: var(--cloud-ok); margin-top: -8px; margin-bottom: 8px; font-weight: bold; }
        .cloud-status.error { color: var(--cloud-err); }

        .theme-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            width: auto;
            padding: 8px 12px;
            font-size: 18px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .luxury-section {
            border: 2px solid var(--btn-search);
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            background: rgba(124, 58, 237, 0.03);
        }
        .luxury-section h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: var(--btn-search);
        }
        .luxury-buttons {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .luxury-buttons button {
            flex: 1;
            padding: 12px 6px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }
        .luxury-buttons button:hover { opacity: 0.9; }
        .btn-luxury-1 { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
        .btn-luxury-2 { background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); }
        .btn-luxury-3 { background: linear-gradient(135deg, #06b6d4 0%, #0e7490 100%); }
    </style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切換深色/淺色">🌙</button>
<h2>浚鍵管理有限公司<br><small style="font-size:14px; font-weight:normal; opacity:0.8;">行車記錄表 (豪華版)</small></h2>
<div class="cloud-status" id="cloudStatus">☁️ 雲端狀態：連線中...</div>

<div class="nav-tabs">
    <button id="tabBtn1" class="active" onclick="switchTab('tab1')">📝 日常輸入 / 班次記錄</button>
    <button id="tabBtn2" onclick="switchTab('tab2')">🔍 月度歷史分析</button>
</div>

<div id="tab1" class="tab-content active">
    <div class="card">
        <label style="color:var(--section-title);">📅 選擇日期</label>
        <input type="date" id="recordDate" onchange="switchDate()">

        <div class="row">
            <div>
                <label>車牌</label>
                <input type="text" id="carPlate" placeholder="例如: AB1234" onchange="saveBasicInfo()">
            </div>
        </div>

        <div class="row">
            <div>
                <label>司機姓名（自動記憶）</label>
                <input type="text" id="driverName" placeholder="你的姓名" onchange="onDriverNameChange()">
            </div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin:0 0 8px 0; font-size:15px;">新增班次紀錄</h3>
        <div class="row">
            <div>
                <label>更次選擇</label>
                <select id="shiftType" onchange="onShiftChange()">
                    <option value="早更">早更</option>
                    <option value="夜更">夜更</option>
                    <option value="特更">特更</option>
                </select>
            </div>
            <div>
                <label>目的地</label>
                <select id="destination"></select>
            </div>
        </div>

        <div class="row">
            <div>
                <label>開出時間</label>
                <input type="time" id="departTime">
            </div>
        </div>

        <div class="section-title">八達通 / 電子支付人次</div>
        <div class="row">
            <div>
                <label>電子 $9</label>
                <div class="stepper-group">
                    <button type="button" class="stepper-btn" onclick="adjustCount('count9Elec', -1)">➖</button>
                    <input type="number" id="count9Elec" value="0" min="0" class="stepper-input" inputmode="numeric">
                    <button type="button" class="stepper-btn" onclick="adjustCount('count9Elec', 1)">➕</button>
                </div>
            </div>
            <div>
                <label>電子 $6</label>
                <div class="stepper-group">
                    <button type="button" class="stepper-btn" onclick="adjustCount('count6Elec', -1)">➖</button>
                    <input type="number" id="count6Elec" value="0" min="0" class="stepper-input" inputmode="numeric">
                    <button type="button" class="stepper-btn" onclick="adjustCount('count6Elec', 1)">➕</button>
                </div>
            </div>
        </div>

        <div class="section-title">現金支付人次</div>
        <div class="row">
            <div>
                <label>現金 $9</label>
                <div class="stepper-group">
                    <button type="button" class="stepper-btn" onclick="adjustCount('count9Cash', -1)">➖</button>
                    <input type="number" id="count9Cash" value="0" min="0" class="stepper-input" inputmode="numeric">
                    <button type="button" class="stepper-btn" onclick="adjustCount('count9Cash', 1)">➕</button>
                </div>
            </div>
            <div>
                <label>現金 $6</label>
                <div class="stepper-group">
                    <button type="button" class="stepper-btn" onclick="adjustCount('count6Cash', -1)">➖</button>
                    <input type="number" id="count6Cash" value="0" min="0" class="stepper-input" inputmode="numeric">
                    <button type="button" class="stepper-btn" onclick="adjustCount('count6Cash', 1)">➕</button>
                </div>
            </div>
        </div>

        <button class="btn-add" onclick="addTrip()">＋ 加入並同步至雲端</button>
    </div>

    <div class="card">
        <h3 style="margin:0 0 8px 0; font-size:15px;">當日班次明細 (雲端同步)</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>更次</th>
                        <th>司機</th>
                        <th>時間</th>
                        <th>方向</th>
                        <th>電$9</th>
                        <th>電$6</th>
                        <th>現$9</th>
                        <th>現$6</th>
                        <th>小計</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tripBody"></tbody>
            </table>
        </div>
        <div id="totalSummary" class="summary" style="padding: 10px; margin-top: 10px; border-radius: 6px;">
            當日總收入：$0
        </div>
    </div>
</div>

<div id="tab2" class="tab-content">
    <div class="card">
        <h3 style="margin:0 0 8px 0; font-size:15px; color:var(--btn-search);">🔍 雲端月度數據檢索</h3>
        <div class="row">
            <div>
                <label>選擇月份</label>
                <input type="month" id="searchMonth">
            </div>
            <div>
                <label>過濾更次</label>
                <select id="searchShift">
                    <option value="ALL">全部更次</option>
                    <option value="早更">單獨看：早更</option>
                    <option value="夜更">單獨看：夜更</option>
                    <option value="特更">單獨看：特更</option>
                </select>
            </div>
        </div>
        <button class="btn-search" onclick="analyzeMonth()">🔎 查詢雲端數據</button>
    </div>

    <div class="card">
        <h3 style="margin:0 0 8px 0; font-size:15px;">月度分析結果</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>更次</th>
                        <th>司機</th>
                        <th>班次數</th>
                        <th>電$9</th>
                        <th>電$6</th>
                        <th>現$9</th>
                        <th>現$6</th>
                        <th>收入小計</th>
                    </tr>
                </thead>
                <tbody id="monthBody">
                    <tr><td colspan="9">請選擇月份並按下「查詢」</td></tr>
                </tbody>
            </table>
        </div>
        <div id="monthSummary" style="font-weight: bold; background-color: var(--month-summary-bg); font-size: 13px; color: var(--text-main); padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid rgba(147, 51, 234, 0.3);">
            月度總結：請先進行查詢
        </div>

        <div class="luxury-section">
            <h4>💎 豪華版 Excel 報表匯出 (A4 自動分頁)</h4>
            <p style="font-size:11px; color:var(--text-label); margin:4px 0;">包含大型標題、統計摘要及自動排版，一鍵列印最方便</p>
            <label>自定開始日期</label>
            <input type="date" id="luxStartDate">
            <label>自定結束日期</label>
            <input type="date" id="luxEndDate">

            <div class="luxury-buttons">
                <button class="btn-luxury-1" onclick="exportLuxuryExcel('firstHalf')">上半個月<br><small>1–15 號</small></button>
                <button class="btn-luxury-2" onclick="exportLuxuryExcel('secondHalf')">下半個月<br><small>16–月底</small></button>
                <button class="btn-luxury-3" onclick="exportLuxuryExcel('custom')">自定日期<br><small>自選範圍</small></button>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== Firebase 設定 =====
    const firebaseConfig = {
        apiKey: "AIzaSyANWLqV5bIFfMX_-byunnEBQ-gZmSn1cj4",
        authDomain: "driver-s-shift-report.firebaseapp.com",
        databaseURL: "https://driver-s-shift-report-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "driver-s-shift-report",
        storageBucket: "driver-s-shift-report.firebasestorage.app",
        messagingSenderId: "790331468274",
        appId: "1:790331468274:web:a0cecd6a8d5f8e157ba36b",
        measurementId: "G-JZSZKCSS27"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const DESTINATIONS = [
        "去 西鐵元朗站",
        "去 大棠/黃泥墩"
    ];
    const PRICE_9 = 9;
    const PRICE_6 = 6;

    let currentDate = "";
    let currentDayData = { plate: "", driver: "", trips: [] };
    let activeListener = null;
    let activeListenerDate = "";

    function adjustCount(elementId, amount) {
        const input = document.getElementById(elementId);
        if (!input) return;
        let currentValue = parseInt(input.value, 10) || 0;
        let newValue = currentValue + amount;
        if (newValue < 0) newValue = 0;
        input.value = newValue;
    }

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const toggleBtn = document.getElementById('themeToggle');
        if (toggleBtn) toggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
        localStorage.setItem('theme', theme);
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    function initTheme() {
        const saved = localStorage.getItem('theme');
        if (saved) {
            applyTheme(saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            applyTheme('dark');
        } else {
            applyTheme('light');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        initTheme();

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('recordDate').value = today;
        document.getElementById('searchMonth').value = today.substring(0, 7);
        document.getElementById('luxStartDate').value = today.substring(0, 7) + '-01';
        document.getElementById('luxEndDate').value = today;

        const destSelect = document.getElementById('destination');
        DESTINATIONS.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            destSelect.appendChild(opt);
        });
        const savedDest = localStorage.getItem('rememberedDest');
        if (savedDest && DESTINATIONS.includes(savedDest)) {
            destSelect.value = savedDest;
        }

        const savedShift = localStorage.getItem('rememberedShift') || '早更';
        document.getElementById('shiftType').value = savedShift;

        loadDriverNameForCurrentShift();
        setDefaultTime();

        db.ref('.info/connected').on('value', (snap) => {
            const statusEl = document.getElementById('cloudStatus');
            if (!statusEl) return;
            if (snap.val() === true) {
                statusEl.classList.remove('error');
                statusEl.textContent = "☁️ 雲端狀態：已連線至 driver-s-shift-report";
            } else {
                statusEl.classList.add('error');
                statusEl.textContent = "⚠️ 雲端狀態：離線中，請檢查網絡";
            }
        });

        switchDate();

        destSelect.addEventListener('change', function() {
            localStorage.setItem('rememberedDest', this.value);
        });
    });

    function loadDriverNameForCurrentShift() {
        const shift = document.getElementById('shiftType').value;
        const savedName = localStorage.getItem('driver_name_' + shift) || '';
        document.getElementById('driverName').value = savedName;
        currentDayData.driver = savedName;
    }

    function onShiftChange() {
        const shift = document.getElementById('shiftType').value;
        localStorage.setItem('rememberedShift', shift);
        loadDriverNameForCurrentShift();
        saveBasicInfo();
    }

    function onDriverNameChange() {
        const shift = document.getElementById('shiftType').value;
        const name = document.getElementById('driverName').value.trim();
        localStorage.setItem('driver_name_' + shift, name);
        saveBasicInfo();
    }

    function setDefaultTime() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('departTime').value = `${hh}:${mm}`;
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
                
        document.getElementById(tabId).classList.add('active');
        if(tabId === 'tab1') document.getElementById('tabBtn1').classList.add('active');
        if(tabId === 'tab2') document.getElementById('tabBtn2').classList.add('active');
    }

    function switchDate() {
        const newDate = document.getElementById('recordDate').value;
        if (!newDate) return;
        if (newDate === activeListenerDate && activeListener) return;

        if (activeListener && activeListenerDate) {
            db.ref('records/' + activeListenerDate).off('value', activeListener);
        }

        currentDate = newDate;
        activeListenerDate = newDate;

        const statusEl = document.getElementById('cloudStatus');
        statusEl.textContent = "☁️ 雲端狀態：資料同步中...";

        activeListener = db.ref('records/' + currentDate).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentDayData = {
                    plate: data.plate || '',
                    driver: data.driver || localStorage.getItem('driver_name_' + document.getElementById('shiftType').value) || '',
                    trips: normalizeTrips(data.trips)
                };
            } else {
                currentDayData = { 
                    plate: '', 
                    driver: localStorage.getItem('driver_name_' + document.getElementById('shiftType').value) || '', 
                    trips: [] 
                };
            }

            document.getElementById('carPlate').value = currentDayData.plate;
            document.getElementById('driverName').value = currentDayData.driver;

            renderTable();
        }, (error) => {
            console.error(error);
            statusEl.classList.add('error');
            statusEl.textContent = "⚠️ 雲端狀態：連線受阻";
        });
    }

    function normalizeTrips(rawTrips) {
        if (!rawTrips) return [];
        if (Array.isArray(rawTrips)) {
            return rawTrips.filter(Boolean).map((t, i) => ({
                ...t,
                id: t.id || ('legacy_' + i)
            }));
        }
        return Object.keys(rawTrips).map(k => ({
            ...rawTrips[k],
            id: k
        }));
    }

    function saveBasicInfo() {
        if (!currentDate) return;
        currentDayData.plate = document.getElementById('carPlate').value.trim();
        currentDayData.driver = document.getElementById('driverName').value.trim();

        db.ref('records/' + currentDate).update({
            plate: currentDayData.plate,
            driver: currentDayData.driver
        }).catch(err => {
            console.error(err);
            alert('儲存基本資料失敗：' + err.message);
        });
    }

    function addTrip() {
        if (!currentDate) return;

        const shift = document.getElementById('shiftType').value;
        const dest = document.getElementById('destination').value;
        const time = document.getElementById('departTime').value;
        const driver = document.getElementById('driverName').value.trim();
                
        const c9Elec = Math.max(0, parseInt(document.getElementById('count9Elec').value, 10) || 0);
        const c6Elec = Math.max(0, parseInt(document.getElementById('count6Elec').value, 10) || 0);
        const c9Cash = Math.max(0, parseInt(document.getElementById('count9Cash').value, 10) || 0);
        const c6Cash = Math.max(0, parseInt(document.getElementById('count6Cash').value, 10) || 0);

        if (!time) { alert('請選擇開出時間！'); return; }
        if (!driver) { alert('請輸入司機姓名！'); return; }

        const elecTotal = (c9Elec * PRICE_9) + (c6Elec * PRICE_6);
        const cashTotal = (c9Cash * PRICE_9) + (c6Cash * PRICE_6);
        const total = elecTotal + cashTotal;

        const trip = {
            shift, driver, dest, time,
            c9Elec, c6Elec, c9Cash, c6Cash,
            elecTotal, cashTotal, total,
            createdAt: Date.now()
        };

        const tripRef = db.ref('records/' + currentDate + '/trips').push();
        trip.id = tripRef.key;

        tripRef.set(trip).then(() => {
            document.getElementById('count9Elec').value = '0';
            document.getElementById('count6Elec').value = '0';
            document.getElementById('count9Cash').value = '0';
            document.getElementById('count6Cash').value = '0';
            setDefaultTime();
        }).catch(err => {
            console.error(err);
            alert('新增班次失敗：' + err.message);
        });
    }

    function deleteTrip(tripId) {
        if (!tripId || !currentDate) return;
        if (confirm('確定要刪除此班次紀錄嗎？')) {
            db.ref('records/' + currentDate + '/trips/' + tripId).remove()
                .catch(err => {
                    console.error(err);
                    alert('刪除失敗：' + err.message);
                });
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tripBody');
        if (!tbody) return;

        const rows = [];
        let grandTotal = 0, totalTrips = 0;
        let sum9E = 0, sum6E = 0, sum9C = 0, sum6C = 0;

        currentDayData.trips.forEach((t) => {
            grandTotal += t.total || 0;
            totalTrips++;
            sum9E += t.c9Elec || 0;
            sum6E += t.c6Elec || 0;
            sum9C += t.c9Cash || 0;
            sum6C += t.c6Cash || 0;

            rows.push(`<tr>
                <td>${escapeHtml(t.shift)}</td>
                <td>${escapeHtml(t.driver || currentDayData.driver || '-')}</td>
                <td>${escapeHtml(t.time)}</td>
                <td>${escapeHtml((t.dest || '').replace('去 ', ''))}</td>
                <td>${t.c9Elec || 0}</td>
                <td>${t.c6Elec || 0}</td>
                <td>${t.c9Cash || 0}</td>
                <td>${t.c6Cash || 0}</td>
                <td>$${t.total || 0}</td>
                <td><button class="btn-del" onclick="deleteTrip('${escapeHtml(t.id)}')">刪除</button></td>
            </tr>`);
        });

        tbody.innerHTML = rows.length > 0
            ? rows.join('')
            : '<tr><td colspan="10">當日暫無班次紀錄</td></tr>';

        document.getElementById('totalSummary').innerHTML =
            `<strong>【${currentDate}】當日總收入：$${grandTotal}</strong><br>` +
            `<small>總班次：${totalTrips} 班 | 電$9: ${sum9E} | 電$6: ${sum6E} | 現$9: ${sum9C} | 現$6: ${sum6C}</small>`;
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function analyzeMonth() {
        const targetMonth = document.getElementById('searchMonth').value;
        const targetShift = document.getElementById('searchShift').value;

        if (!targetMonth) { alert('請選擇要查詢的月份'); return; }

        const [year, month] = targetMonth.split('-').map(Number);
        const lastDayNum = new Date(year, month, 0).getDate();
        const startDate = `${targetMonth}-01`;
        const endDate = `${targetMonth}-${String(lastDayNum).padStart(2, '0')}`;

        db.ref('records')
            .orderByKey()
            .startAt(startDate)
            .endAt(endDate + '\uf8ff')
            .once('value')
            .then((snapshot) => {
                const allRecords = snapshot.val() || {};
                const monthBody = document.getElementById('monthBody');
                const rows = [];

                let mTripsCount = 0, mTotalRev = 0;
                let m9E = 0, m6E = 0, m9C = 0, m6C = 0;

                const dates = Object.keys(allRecords).sort();
                if (dates.length === 0) {
                    monthBody.innerHTML = `<tr><td colspan="9">【${targetMonth}】無任何雲端紀錄</td></tr>`;
                    document.getElementById('monthSummary').innerHTML = `月度總結：該月份無資料`;
                    return;
                }

                dates.forEach(d => {
                    const dayData = allRecords[d];
                    if (!dayData) return;
                    const trips = normalizeTrips(dayData.trips);
                    const filteredTrips = trips.filter(t => targetShift === 'ALL' || t.shift === targetShift);

                    if (filteredTrips.length > 0) {
                        let dayRev = 0, d9E = 0, d6E = 0, d9C = 0, d6C = 0;
                        filteredTrips.forEach(t => {
                            dayRev += t.total || 0;
                            d9E += t.c9Elec || 0; d6E += t.c6Elec || 0;
                            d9C += t.c9Cash || 0; d6C += t.c6Cash || 0;
                        });

                        mTripsCount += filteredTrips.length;
                        mTotalRev += dayRev;
                        m9E += d9E; m6E += d6E;
                        m9C += d9C; m6C += d6C;

                        const driverName = filteredTrips[0]?.driver || dayData.driver || '-';

                        rows.push(`<tr>
                            <td>${escapeHtml(d)}</td>
                            <td>${escapeHtml(targetShift === 'ALL' ? '混合' : targetShift)}</td>
                            <td>${escapeHtml(driverName)}</td>
                            <td>${filteredTrips.length}</td>
                            <td>${d9E}</td>
                            <td>${d6E}</td>
                            <td>${d9C}</td>
                            <td>${d6C}</td>
                            <td><strong>$${dayRev}</strong></td>
                        </tr>`);
                    }
                });

                monthBody.innerHTML = rows.length > 0
                    ? rows.join('')
                    : `<tr><td colspan="9">【${targetMonth}】無符合條件的紀錄</td></tr>`;

                document.getElementById('monthSummary').innerHTML =
                    `<strong>【${targetMonth} (${targetShift})】雲端總結：</strong><br>` +
                    `總班次：${mTripsCount} 班 | 總收入：$${mTotalRev}<br>` +
                    `<small>八達通/電子：$9 人次: ${m9E} | $6 人次: ${m6E}</small><br>` +
                    `<small>現金：$9 人次: ${m9C} | $6 人次: ${m6C}</small>`;
            })
            .catch(err => {
                console.error(err);
                alert('查詢失敗：' + err.message);
            });
    }

    function getDateRange(mode) {
        const today = new Date();
        const y = today.getFullYear();
        const m = today.getMonth(); 
        const monthStr = String(m + 1).padStart(2, '0');

        if (mode === 'firstHalf') {
            return {
                start: `${y}-${monthStr}-01`,
                end: `${y}-${monthStr}-15`,
                label: `${y}年${m + 1}月 上半個月 (1–15號)`
            };
        }
        if (mode === 'secondHalf') {
            const lastDay = new Date(y, m + 1, 0).getDate();
            return {
                start: `${y}-${monthStr}-16`,
                end: `${y}-${monthStr}-${String(lastDay).padStart(2, '0')}`,
                label: `${y}年${m + 1}月 下半個月 (16–${lastDay}號)`
            };
        }
        
        const s = document.getElementById('luxStartDate').value;
        const e = document.getElementById('luxEndDate').value;

        if (!s || !e) {
            alert('請選擇自定開始同結束日期');
            return null;
        }
        if (s > e) {
            alert('開始日期唔可以遲過結束日期');
            return null;
        }
        return { start: s, end: e, label: `自定範圍：${s} 至 ${e}` };
    }

    async function exportLuxuryExcel(mode) {
        const range = getDateRange(mode);
        if (!range) return;

        if (typeof ExcelJS === 'undefined') {
            alert('ExcelJS 庫未載入成功，請檢查網絡連線後重試。');
            return;
        }

        try {
            const snapshot = await db.ref('records')
                .orderByKey()
                .startAt(range.start)
                .endAt(range.end + '\uf8ff')
                .once('value');

            const allRecords = snapshot.val() || {};
            const dates = Object.keys(allRecords).sort();

            if (dates.length === 0) {
                alert(`【${range.label}】無任何紀錄可匯出`);
                return;
            }

            const workbook = new ExcelJS.Workbook();
            workbook.creator = '浚鍵管理有限公司 - 行車記錄表';
            workbook.created = new Date();

            // ===== 封面摘要分頁（橫向排列：紙張大小 A4，方向橫向 landscape） =====
            const coverSheet = workbook.addWorksheet('封面摘要', {
                properties: { defaultRowHeight: 22 },
                pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 1 },
                views: [{ showGridLines: true }]
            });

            coverSheet.columns = [
                { width: 22 }, { width: 22 }, { width: 22 },
                { width: 22 }, { width: 22 }, { width: 22 }
            ];

            // 大標題
            coverSheet.mergeCells('A1:F1');
            const titleCell = coverSheet.getCell('A1');
            titleCell.value = '浚鍵管理有限公司';
            titleCell.font = { name: '微軟正黑體', size: 24, bold: true, color: { argb: 'FFFFFFFF' } };
            titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
            titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E3A8A' } };
            coverSheet.getRow(1).height = 45;

            coverSheet.mergeCells('A2:F2');
            const subCell = coverSheet.getCell('A2');
            subCell.value = '行車記錄報表';
            subCell.font = { name: '微軟正黑體', size: 16, bold: true, color: { argb: 'FF2563EB' } };
            subCell.alignment = { horizontal: 'center', vertical: 'middle' };
            coverSheet.getRow(2).height = 30;

            coverSheet.mergeCells('A3:F3');
            const rangeCell = coverSheet.getCell('A3');
            rangeCell.value = range.label;
            rangeCell.font = { name: '微軟正黑體', size: 13, bold: true, color: { argb: 'FF475569' } };
            rangeCell.alignment = { horizontal: 'center', vertical: 'middle' };
            coverSheet.getRow(3).height = 25;

            let totalTrips = 0, totalRev = 0;
            let sum9E = 0, sum6E = 0, sum9C = 0, sum6C = 0;
            let dayCount = 0;

            dates.forEach(d => {
                const day = allRecords[d];
                if (!day) return;
                const trips = normalizeTrips(day.trips);
                if (trips.length > 0) {
                    dayCount++;
                    trips.forEach(t => {
                        totalTrips++;
                        totalRev += t.total || 0;
                        sum9E += t.c9Elec || 0;
                        sum6E += t.c6Elec || 0;
                        sum9C += t.c9Cash || 0;
                        sum6C += t.c6Cash || 0;
                    });
                }
            });

            const stats = [
                ['報表生成時間', new Date().toLocaleString('zh-HK'), '涵蓋日數', `${dayCount} 日`],
                ['總班次', `${totalTrips} 班`, '總收入', `HK$ ${totalRev.toLocaleString()}`],
                ['電子 $9 人次', `${sum9E} 人次`, '電子 $6 人次', `${sum6E} 人次`],
                ['現金 $9 人次', `${sum9C} 人次`, '現金 $6 人次', `${sum6C} 人次`]
            ];

            let rowIdx = 5;
            stats.forEach(([label1, val1, label2, val2]) => {
                coverSheet.mergeCells(`A${rowIdx}:B${rowIdx}`);
                const l1Cell = coverSheet.getCell(`A${rowIdx}`);
                l1Cell.value = label1;
                l1Cell.font = { name: '微軟正黑體', size: 11, bold: true, color: { argb: 'FF334155' } };
                l1Cell.alignment = { horizontal: 'left', vertical: 'middle' };
                l1Cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF1F5F9' } };

                coverSheet.mergeCells(`C${rowIdx}:C${rowIdx}`);
                const v1Cell = coverSheet.getCell(`C${rowIdx}`);
                v1Cell.value = val1;
                v1Cell.font = { name: '微軟正黑體', size: 11, color: { argb: 'FF0F172A' } };
                v1Cell.alignment = { horizontal: 'left', vertical: 'middle' };

                coverSheet.mergeCells(`D${rowIdx}:E${rowIdx}`);
                const l2Cell = coverSheet.getCell(`D${rowIdx}`);
                l2Cell.value = label2;
                l2Cell.font = { name: '微軟正黑體', size: 11, bold: true, color: { argb: 'FF334155' } };
                l2Cell.alignment = { horizontal: 'left', vertical: 'middle' };
                l2Cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF1F5F9' } };

                coverSheet.mergeCells(`F${rowIdx}:F${rowIdx}`);
                const v2Cell = coverSheet.getCell(`F${rowIdx}`);
                v2Cell.value = val2;
                v2Cell.font = { name: '微軟正黑體', size: 11, color: { argb: 'FF0F172A' } };
                v2Cell.alignment = { horizontal: 'left', vertical: 'middle' };

                coverSheet.getRow(rowIdx).height = 28;
                rowIdx++;
            });

            // ===== 班次明細分頁 =====
            const detailSheet = workbook.addWorksheet('班次明細', {
                pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 },
                views: [{ state: 'frozen', ySplit: 1, showGridLines: true }]
            });

            detailSheet.columns = [
                { header: '日期', key: 'date', width: 12 },
                { header: '車牌', key: 'plate', width: 10 },
                { header: '更次', key: 'shift', width: 8 },
                { header: '司機', key: 'driver', width: 12 },
                { header: '開出時間', key: 'time', width: 10 },
                { header: '目的地', key: 'dest', width: 18 },
                { header: '電$9', key: 'c9e', width: 8 },
                { header: '電$6', key: 'c6e', width: 8 },
                { header: '現$9', key: 'c9c', width: 8 },
                { header: '現$6', key: 'c6c', width: 8 },
                { header: '小計(HKD)', key: 'total', width: 12 }
            ];

            const headerRow = detailSheet.getRow(1);
            headerRow.height = 30;
            headerRow.eachCell((cell) => {
                cell.font = { name: '微軟正黑體', size: 12, bold: true, color: { argb: 'FFFFFFFF' } };
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } };
                cell.alignment = { horizontal: 'center', vertical: 'middle' };
            });

            dates.forEach(d => {
                const day = allRecords[d];
                if (!day) return;
                const trips = normalizeTrips(day.trips);
                trips.forEach(t => {
                    detailSheet.addRow({
                        date: d,
                        plate: day.plate || '-',
                        shift: t.shift,
                        driver: t.driver || day.driver || '-',
                        time: t.time,
                        dest: t.dest,
                        c9e: t.c9Elec || 0,
                        c6e: t.c6Elec || 0,
                        c9c: t.c9Cash || 0,
                        c6c: t.c6Cash || 0,
                        total: t.total || 0
                    });
                });
            });

            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `豪華行車報表_${range.start}_至_${range.end}.xlsx`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 5000);

        } catch (err) {
            console.error(err);
            alert('豪華版 Excel 匯出失敗：' + err.message);
        }
    }
</script>
